<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7">
  <title>Нет соединения — Копейка</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Inter, sans-serif;
      background: radial-gradient(circle at 20% 10%, #dceeff 0, transparent 45%), #f2f2f7;
      color: #1c1c1e;
    }
    .card {
      width: min(420px, 100%); padding: 36px 28px; border-radius: 28px; text-align: center;
      background: rgba(255,255,255,.78); border: 1px solid rgba(255,255,255,.8);
      box-shadow: 0 24px 70px rgba(40,55,90,.14), 0 3px 10px rgba(40,55,90,.06);
      backdrop-filter: blur(24px) saturate(160%);
    }
    .coin {
      width: 86px; height: 86px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(145deg, #ffe99b, #ffc247 52%, #df8e1b);
      color: #fff9df; font-size: 42px; font-weight: 800;
      box-shadow: 0 14px 28px rgba(221,142,27,.28), inset 0 1px 1px rgba(255,255,255,.7);
    }
    h1 { margin: 0 0 12px; font-size: 28px; letter-spacing: -.03em; }
    p { margin: 0 0 24px; color: #6e6e73; line-height: 1.5; }
    a {
      display: inline-block; padding: 14px 24px; border-radius: 16px; text-decoration: none;
      color: #fff; background: #007aff; font-weight: 650; box-shadow: 0 8px 20px rgba(0,122,255,.25);
    }
    @media (prefers-color-scheme: dark) {
      body { background: radial-gradient(circle at 20% 10%, #12253b 0, transparent 45%), #000; color: #f5f5f7; }
      .card { background: rgba(28,28,30,.82); border-color: rgba(255,255,255,.1); box-shadow: 0 24px 70px rgba(0,0,0,.45); }
      p { color: #a1a1a6; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="coin" aria-hidden="true">К</div>
    <h1>Интернет куда-то пропал</h1>
    <p>Открой «Копейку» ещё раз — после первого запуска приложение работает офлайн. Если страница всё равно не загружается, проверь соединение.</p>
    <a href="./index.html">Попробовать снова</a>
  </main>
</body>
</html>
